name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Firebase tools
        run: npm install --global firebase-tools

      - name: Install Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter dependencies
        run: flutter pub get

      # Same entry point developers run locally: Flutter analysis/tests/build
      # plus the backend compilation/unit/emulator suites.
      - name: Verify (Flutter + functions)
        run: bash tool/verify.sh

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            docs/verification.md
            build/web
          if-no-files-found: ignore
