name: Unified verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IEADPE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify runner Chrome and ChromeDriver
        run: |
          set -euo pipefail
          test -n "${CHROMEWEBDRIVER:-}"
          driver="$CHROMEWEBDRIVER/chromedriver"
          test -x "$driver"
          echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
          chrome_major="$(google-chrome --version | sed -E 's/.* ([0-9]+)\..*/\1/')"
          driver_major="$("$driver" --version | sed -E 's/.*ChromeDriver ([0-9]+)\..*/\1/')"
          test "$chrome_major" = "$driver_major"
          echo "Chrome/ChromeDriver major version $chrome_major is compatible."
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Resolve dependencies
        run: flutter pub get
      - name: Start local Supabase services
        run: |
          set -euo pipefail
          supabase start --exclude studio,edge-runtime,logflare,vector,imgproxy,supavisor 2>&1 | python3 scripts/redact_supabase_start.py
          supabase status --output json | python3 -c '
          import json, os, sys
          status = json.load(sys.stdin)
          api_url = status.get("API_URL")
          anon_key = status.get("ANON_KEY")
          if not isinstance(api_url, str) or not api_url or "\n" in api_url or "\r" in api_url:
              raise SystemExit("local Supabase status has no safe API_URL")
          if not isinstance(anon_key, str) or not anon_key or "\n" in anon_key or "\r" in anon_key:
              raise SystemExit("local Supabase status has no safe ANON_KEY")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SUPABASE_URL={api_url}\nSUPABASE_ANON_KEY={anon_key}\n")
          '
      - name: Run the unified gate
        run: bash scripts/verify_unified.sh
      - name: Publish verification report
        if: always()
        run: |
          if [ -f build/verification/unified-report.md ]; then
            cat build/verification/unified-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-verification-${{ github.run_id }}
          path: build/verification/
          if-no-files-found: warn
